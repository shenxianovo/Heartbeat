name: heartbeat

x-backend-build: &backend-build
  context: .
  dockerfile: src/Backend/Heartbeat.Api/Dockerfile
  target: final

x-backend-environment: &backend-environment
  ConnectionStrings__Heartbeat: Host=db;Port=5432;Database=heartbeat;Username=heartbeat;Password=heartbeat

services:
  db:
    image: postgres:18.6-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
      - -c
      - log_min_duration_statement=500ms
      - -c
      - log_lock_waits=on
    environment:
      POSTGRES_DB: heartbeat
      POSTGRES_USER: heartbeat
      POSTGRES_PASSWORD: heartbeat
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql
      - type: bind
        source: ./src/Backend/Heartbeat.Infrastructure/Database/Docker/initialize.sql
        target: /docker-entrypoint-initdb.d/initialize.sql
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heartbeat -d heartbeat"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: *backend-build
    entrypoint: ["/app/efbundle"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: *backend-build
    environment:
      <<: *backend-environment
      ASPNETCORE_HTTP_PORTS: 8080
    depends_on:
      migrate:
        condition: service_completed_successfully

  docs:
    build:
      context: .
      dockerfile: src/Docs/Heartbeat.Docs/Dockerfile
      target: final
    environment:
      HEARTBEAT_TEST_REPORTS_DIR: /reports
    volumes:
      - type: bind
        source: ./TestResults
        target: /reports
        read_only: true

  nginx:
    image: nginx:1.30.5-alpine
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:3000:3000"
    volumes:
      - type: bind
        source: ./docker/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true

volumes:
  postgres-data:
