name: heartbeat

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: heartbeat
      POSTGRES_USER: heartbeat
      POSTGRES_PASSWORD: heartbeat
    ports:
      - "54329:5432"
    volumes:
      - heartbeat-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heartbeat -d heartbeat"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: src/Backend/Heartbeat.Api/Dockerfile
    command: ["--migrate"]
    environment:
      ConnectionStrings__Heartbeat: Host=db;Port=5432;Database=heartbeat;Username=heartbeat;Password=heartbeat
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/Backend/Heartbeat.Api/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Heartbeat: Host=db;Port=5432;Database=heartbeat;Username=heartbeat;Password=heartbeat
      AuthService__Authority: ${AUTH_AUTHORITY:-https://auth.shenxianovo.com}
      AuthService__Issuer: ${AUTH_ISSUER:-https://auth.shenxianovo.com}
      AuthService__Audience: ${AUTH_AUDIENCE:-https://auth.shenxianovo.com}
      AuthService__OidcIssuer: ${AUTH_OIDC_ISSUER:-https://auth.shenxianovo.com/}
      AuthService__OidcClientId: ${AUTH_OIDC_CLIENT_ID:-heartbeat-web}
      AuthService__OidcAudience: ${AUTH_OIDC_AUDIENCE:-}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  heartbeat-postgres:
