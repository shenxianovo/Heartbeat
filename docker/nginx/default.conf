server {
    listen 80;
    server_name _;
    absolute_redirect off;
    error_page 413 = @request_too_large;

    location /api/ {
        proxy_pass http://orisumi_api/;
    }

    location / {
        return 404;
    }

    location @request_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"Content Too Large","status":413,"detail":"The request body must not exceed 10 MiB."}';
    }
}

server {
    listen 3000;
    server_name _;
    absolute_redirect off;
    error_page 413 = @request_too_large;

    location ~ ^/api/(versions|entities|observations)(/|$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://orisumi_api;
    }

    location / {
        proxy_pass http://orisumi_docs;
    }

    location @request_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"Content Too Large","status":413,"detail":"The request body must not exceed 10 MiB."}';
    }
}

server {
    listen 3100;
    server_name _;
    absolute_redirect off;
    error_page 413 = @request_too_large;

    location /api/ {
        proxy_pass http://orisumi_api/;
    }

    # Vite dev server：SPA 回退与 HMR（/、/@vite/*、@id/*）均由其处理，
    # 全局的 Upgrade/Connection 头已经支持 WebSocket。
    location / {
        proxy_pass http://orisumi_web;
    }

    location @request_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"Content Too Large","status":413,"detail":"The request body must not exceed 10 MiB."}';
    }
}
