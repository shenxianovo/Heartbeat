map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}

resolver 127.0.0.11 valid=30s ipv6=off;

upstream heartbeat_api {
    zone heartbeat_api 64k;
    server ${API_HOST}:${API_PORT} resolve;
    keepalive 16;
}

upstream heartbeat_docs {
    zone heartbeat_docs 64k;
    server ${DOCS_HOST}:${DOCS_PORT} resolve;
    keepalive 16;
}

client_max_body_size 10m;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    error_page 413 = @request_too_large;

    location /api/ {
        proxy_pass http://heartbeat_api/;
    }

    location / {
        return 404;
    }

    location @request_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"Content Too Large","status":413,"detail":"The request body must not exceed 10 MiB."}';
    }
}

server {
    listen 3000;
    server_name _;
    absolute_redirect off;
    error_page 413 = @request_too_large;

    location /api/entities/ {
        proxy_pass http://heartbeat_api/entities/;
    }

    location / {
        proxy_pass http://heartbeat_docs;
    }

    location @request_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"Content Too Large","status":413,"detail":"The request body must not exceed 10 MiB."}';
    }
}
