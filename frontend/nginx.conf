# Heartbeat frontend container: serves the SPA and reverse-proxies API
# traffic to the backend container on the compose network.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Using a variable in proxy_pass forces per-request
    # resolution, so a backend restart (new IP) doesn't strand a stale upstream.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 出口（Recap 生成、知识发问/整理）会同步等上游几十秒到几分钟。
        # proxy_read_timeout 的默认值是 60s,且它计的是**两次成功读之间**的间隔,
        # 不是整段响应的总时长——所以它不是"生成必须在 60s 内完成",而是"上游不能
        # 沉默超过 60s"。生成一旦超时,nginx 返回自己的 HTML 504,应用层的可读错误
        # (502 + 原因)会被整段吞掉。300s 不是性能余量,而是兜底:Recap 流式生成
        # (ADR-042)靠 15s SSE 心跳保持读活性,正常永远不会走到这个上限。
        proxy_read_timeout 300s;

        # SSE 必须逐块下发。缓冲开着不会造成超时(上游读活性不受影响),但会把
        # 流式攒到最后一次性吐出,前端"逐段浮现"白做。
        proxy_buffering off;
    }

    # OpenAPI 文档:仅 Development 后端暴露(本地 compose 栈 regen client 用);
    # 生产后端不 serve 此路径,代理过去只是 404,无害。
    location /openapi/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
