name: Deploy Dashboard

on:
  # Production deployment is explicit and independent from Backend, Hub, and Collectors.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/shenxianovo/heartbeat-frontend

jobs:
  image:
    name: Build Dashboard image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dashboard dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check Dashboard
        run: npm run typecheck
        working-directory: frontend

      - name: Run Dashboard tests
        run: npm test
        working-directory: frontend

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Dashboard
    needs: image
    runs-on: ubuntu-latest
    concurrency: deploy-frontend-production
    steps:
      - uses: actions/checkout@v7

      - name: Sync compose.yml to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: compose.yml
          target: /srv/heartbeat

      - name: Deploy Dashboard container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            cd /srv/heartbeat
            docker compose pull frontend
            docker compose up -d --no-deps frontend
            docker compose ps frontend
