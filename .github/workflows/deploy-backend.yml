name: Deploy Analytics

on:
  # Production deployment is explicit and independent from Frontend, Hub, and Collectors.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/shenxianovo/heartbeat-backend

# Hold one release across build, stop/backup/migrate, and startup. Never cancel an active migration.
concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  image:
    name: Build Analytics image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run Analytics integration tests
        run: dotnet test server/Heartbeat.Server.Tests/Heartbeat.Server.Tests.csproj --configuration Release

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify deployment, local startup, and refresh scripts
        run: python3 -m unittest discover -s scripts/tests

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Analytics image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Stop writes, back up, and migrate database
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Upload release composition and deployment script
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: compose.yml,scripts/deploy-analytics.sh
          target: /srv/heartbeat/releases/${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run database migration without starting HTTP
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 350m
          script: |
            set -eu
            cd /srv/heartbeat
            bash releases/${{ github.run_id }}-${{ github.run_attempt }}/scripts/deploy-analytics.sh \
              migrate '${{ env.IMAGE }}@${{ needs.image.outputs.digest }}'

  deploy:
    name: Start Analytics and verify health
    needs: [image, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # A retried deploy job gets a new run_attempt, so upload its own script too.
      - uses: actions/checkout@v7
      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: compose.yml,scripts/deploy-analytics.sh
          target: /srv/heartbeat/releases/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check schema, start the migrated image, and await health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 55m
          script: |
            set -eu
            cd /srv/heartbeat
            bash releases/${{ github.run_id }}-${{ github.run_attempt }}/scripts/deploy-analytics.sh \
              deploy '${{ env.IMAGE }}@${{ needs.image.outputs.digest }}'
