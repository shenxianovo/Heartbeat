name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - 'src/Docs/Orisumi.Docs/**'
      - 'src/Core/**'
      - 'src/Backend/**'
      - 'src/Observers/**'
      - 'tests/**'
      - 'Directory.*.props'
      - 'global.json'
      - '**/README.md'
      - '**/AGENTS.md'
      - '.agents/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.3.4'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install documentation dependencies
        run: pnpm --dir src/Docs/Orisumi.Docs install --frozen-lockfile
      - name: Check documentation
        working-directory: src/Docs/Orisumi.Docs
        run: |
          pnpm docs:check
          pnpm test
          pnpm types:check
      - name: Generate the integration test report for this revision
        run: dotnet test --project tests/Orisumi.Integration.Tests/Orisumi.Integration.Tests.csproj
      - name: Build the static documentation and check its output
        working-directory: src/Docs/Orisumi.Docs
        env:
          ORISUMI_TEST_REPORTS_DIR: ${{ github.workspace }}/TestResults
        run: pnpm build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: src/Docs/Orisumi.Docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
